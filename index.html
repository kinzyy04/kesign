<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Kesign — Design Agency for Brands, Products, Creators & Businesses</title>
    <meta name="description" content="Kesign is a modern creative design studio founded by IIT Delhi students. We craft high-impact visual design across advertising, branding, e-commerce, editorials, events, infographics, print-on-demand, restaurants, and social media." />
    <meta name="keywords" content="design agency, graphic design agency, creative design studio, design studio Delhi, graphic design agency India, branding and identity design, advertising design agency, ecommerce product graphics, restaurant menu design, social media creatives, print on demand design, infographic design studio, editorial publication design, IIT Delhi design studio, designing work agency" />
    <meta name="author" content="Kesign Design Studio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kesign.me/" />
    <meta name="theme-color" content="#F6F6F6" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kesign.me/" />
    <meta property="og:title" content="Kesign — Design Agency for Brands, Products, Creators & Businesses" />
    <meta property="og:description" content="A modern IIT Delhi student-founded design studio creating high-quality visual work for brands, businesses, creators, products and experiences." />
    <meta property="og:image" content="/assets/portfolio/advertising-nova-rift-billboard.webp" />
    <meta property="og:site_name" content="Kesign Studio" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://kesign.me/" />
    <meta name="twitter:title" content="Kesign — Design Agency for Brands, Products, Creators & Businesses" />

    <meta name="twitter:image" content="/assets/portfolio/advertising-nova-rift-billboard.webp" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">

        {
          "@type": "Organization",
          "@id": "https://kesign.me/#organization",
          "name": "Kesign",
          "alternateName": "Kesign Design Studio",
          "url": "https://kesign.me/",
          "logo": "https://kesign.me/favicon.svg",
          "description": "Modern creative design studio founded by IIT Delhi engineering students specializing in 9 core visual disciplines.",
          "founder": [
            { "@type": "Person", "name": "Krinjal Agrawal" },
            { "@type": "Person", "name": "Kshitija Karmore" },
            { "@type": "Person", "name": "Krishna Thakur" },
            { "@type": "Person", "name": "Krishan Sawariya" }
          ],
          "sameAs": [
            "https://linkedin.com/in/krinjal-agrawal"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://kesign.me/#website",
          "url": "https://kesign.me/",
          "name": "Kesign Design Studio",
          "description": "High-quality visual design for brands, businesses, creators, products and experiences.",
          "publisher": { "@id": "https://kesign.me/#organization" }
        },
        {
          "@type": "Service",
          "name": "Graphic & Visual Design Services",
          "provider": { "@id": "https://kesign.me/#organization" },
          "serviceType": [
            "Advertising & Marketing Design",
            "Branding & Visual Identity",
            "Products & E-Commerce Visuals",
            "Editorials & Publishing Layouts",
            "Events & Experience Branding",
            "Infographics & Information Design",
            "Print-on-Demand Apparel & Merchandise",
            "Restaurant & Café Menu Design",
            "Social Media Creatives & Carousels"
          ]
        }
      ]
    }
    </script>
